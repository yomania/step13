meta:
  version: "2026-02-20-auth-profile-sync"
  last_synced: "2026-02-20"
  source_of_truth:
    rules: "packages/core/src/rules.ts"
    machine: "packages/core/src/machine.ts"
    scoring: "packages/scoring/src/points.ts"
    room: "apps/server/src/GameRoom.ts"

product:
  name: "17보 마작"
  genre: "2인 리치 마작 변형"
  runtime:
    transport: "WebSocket"
    server_authoritative: true
    default_room_id: "lobby"
    authentication:
      required: true
      account_id: "email"
      session: "access+refresh jwt"
      ws_bootstrap: "POST /auth/ws-ticket -> ws://.../ws?ticket=..."
  modes:
    - id: "match_pvp"
      status: "implemented"
    - id: "match_vs_ai"
      status: "implemented"
    - id: "single_hand_build_mini_game"
      status: "implemented"
    - id: "replay_viewer"
      status: "implemented"

ruleset:
  active_ruleset: "classic"
  match:
    players_per_room: 2
    hands_per_match: 4
    starting_points: 60000
    renchan: false
    round_wind: "EAST_FIXED"
    bankrupt_end_threshold: 0
  timers_ms:
    match_start_delay: 1000
    dora_select_timeout: 15000
    dora_reveal_delay_after_selected: 3000
    hand_build_timeout: 120000
    turn_timeout: 10000
    turn_overtime_time_bank: 3000
  tiles:
    dealt_per_player: 34
    hand_size: 13
    pool_size: 21
    discards_per_player: 17
    dora:
      enabled: true
      count: 1
      red_dora: false
      kan_dora: false
  actions:
    allow_tsumo: false
    allow_calls: false
    allow_ron: true
    auto_ron: true
    auto_discard_on_timeout: true
  scoring:
    type: "riichi_han_fu"
    options:
      require_mangan_minimum: true
      include_omote_dora_in_minimum: true
      kiriage_mangan: true
      auto_riichi_fallback: true
    mangan_minimum_points: 8000
  draw:
    condition: "after_17_discards_each"
    noten_bappu:
      enabled: true
      amount: 3000
      applied_when: "only_one_tenpai_player"

state_machine:
  phases:
    - "idle"
    - "matchStart"
    - "doraSelect"
    - "handBuild"
    - "gameLoop.turn"
    - "gameLoop.turnOvertime"
    - "gameLoop.checkRon"
    - "roundEnd"
    - "matchEnd"
  round_end_gate:
    requires_all_players_confirm: true
    confirm_event: "CONFIRM_ROUND_END"
    bot_auto_confirm: true

api_contract:
  http_auth_profile:
    - "POST /auth/register"
    - "POST /auth/login"
    - "POST /auth/refresh"
    - "POST /auth/logout"
    - "POST /auth/ws-ticket"
    - "GET /me"
    - "PATCH /me/profile"
    - "GET /me/stats/summary"
  http_rooms:
    - "POST /rooms"
  client_to_server:
    - "JOIN (no payload playerId; server binds by authenticated user)"
    - "START_MATCH"
    - "ADD_BOT"
    - "SELECT_DORA"
    - "SUBMIT_HAND"
    - "DISCARD"
    - "DECLARE_WIN"
    - "CONFIRM_ROUND_END"
    - "RESTART"
    - "GUIDE_VIEW"
    - "QUERY_ANALYSIS"
    - "QUERY_PERSONAS"
  server_to_client:
    - "UPDATE"
    - "ANALYSIS_RESULT"
    - "PERSONA_LIST_RESULT"
    - "REJECTED_EVENT"
    - "UPDATE.playerProfiles (playerId->nickname/avatarKey)"
  analysis_query_types:
    - "SHANTEN"
    - "SCORE"
    - "SCORE_PREVIEW"
    - "AI_HINT"
    - "MINI_GAME_EVAL"
  correlation_rule:
    query_id_required: true
    stale_response_should_be_ignored_by_client: true
  ws_room:
    query_param: "roomId (optional, defaults to lobby; non-default rooms must be created first)"

security_visibility:
  auth:
    access_token_ttl_sec: 900
    refresh_token_ttl_sec: 2592000
    refresh_rotation: true
    ws_ticket_ttl_sec: 30
    ws_ticket_single_use: true
  fog_of_war:
    wall:
      policy: "selected dora only visible, others masked as wall-{index}"
    opponent_hand_and_pool:
      policy: "masked before ROUND_END"
    opponent_dealt_tiles:
      policy: "always masked"
  sensitive_metadata:
    deterministic_seed:
      policy: "masked in client snapshot"
    event_log_start_match_seed:
      policy: "masked in sanitized eventLog"

replay:
  enabled: true
  source: "context.eventLog"
  deterministic_rebuild: true
  guide:
    immediate_loss_tiles: true
    alternatives_top_n: 3
    blunder_tagging: true

ai:
  bot_package: "@step13/bot"
  personas_source: "packages/bot/src/personas.ts"
  persona_ids:
    - "easy_relaxed"
    - "medium_balanced"
    - "medium_flush"
    - "hard_defensive"
    - "hard_value"

profile_and_stats:
  profile:
    fields:
      - "nickname (unique)"
      - "avatarKey"
      - "bio"
      - "leaveCount"
  stats_v1:
    scope: "match summary only"
    recent_window: 10
    stores:
      - "mode (pvp/ai)"
      - "winner"
      - "finalScore"
      - "scoreDelta"
      - "totalRounds"

non_goals_current:
  - "tsumo win flow"
  - "chi/pon/kan call flow"
  - "multi-room persistence"
